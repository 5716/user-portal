<div class="pt-6">
  <!-- @if (userResource.hasValue() && userResource.value(); as user) {
  <app-user [user]="user"></app-user>
  } @else {
  <h5 class="!text-red-500 mb-6">User not found</h5>
  } -->

  <div class="grid grid-cols-3 md:grid-cols-6 lg:grid-cols-10 gap-4">
    @for (photo of photosResource.value().slice(0, 12); track photo.id) {
    <img [src]="'https://picsum.photos/seed/' + photo.id + '/150'" [alt]="photo.title" class="rounded-lg w-full cursor-pointer hover:opacity-80" (click)="selected.set(photo)" />
    }
  </div>
</div>

<nz-modal [nzVisible]="selected() !== null" [nzTitle]="modalTitle()" [nzFooter]="null" nzCentered nzWidth="640px" (nzOnCancel)="selected.set(null)">
  <ng-container *nzModalContent>
    @if (selected(); as photo) {
    <img [src]="'https://picsum.photos/seed/' + photo.id + '/600'" [alt]="photo.title" class="w-full rounded-lg" />
    }
  </ng-container>
</nz-modal>
