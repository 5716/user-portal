<div class="pt-6">
  @if (userResource.value(); as user) {
    <h1 class="text-2xl font-semibold mb-2">{{ user.name }}</h1>
    <p class="text-gray-500 mb-6">{{ user.email }}</p>
  }

  @for (post of postsResource.value().slice(0, 12); track post.id) {
    <div
      class="cursor-pointer rounded-lg p-3 -mx-3 hover:bg-gray-500/10"
      (click)="selected.set(post)"
    >
      <h2 class="text-lg font-semibold">{{ post.title }}</h2>
      <p class="text-gray-700 line-clamp-2">{{ post.body }}</p>
    </div>
  }
</div>

<nz-modal
  [nzVisible]="selected() !== null"
  [nzTitle]="modalTitle()"
  [nzFooter]="null"
  nzCentered
  (nzOnCancel)="selected.set(null)"
>
  <ng-container *nzModalContent>
    <p>{{ selected()?.body }}</p>
  </ng-container>
</nz-modal>
