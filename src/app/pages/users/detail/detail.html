<div class="p-4">
  <nz-page-header
    class="mb-6"
    (nzBack)="onBack()"
    nzBackIcon
    [nzTitle]="user().name"
    [nzSubtitle]="user().email"
  />

  <nz-tabs [nzSelectedIndex]="selectedIndex()">
    <nz-tab nzTitle="ფოტოები" (nzClick)="go('photos')"></nz-tab>
    <nz-tab nzTitle="პოსტები" (nzClick)="go('posts')"></nz-tab>
    <nz-tab nzTitle="საქმეების სია" (nzClick)="go('todos')"></nz-tab>
  </nz-tabs>

  <router-outlet />
</div>
